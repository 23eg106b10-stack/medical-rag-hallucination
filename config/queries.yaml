# Query Specification — Source B (NCBI E-utilities)
#
# M3.1.1 Query Specification v1.0 (FROZEN)
#
# This is the project's approved, version-controlled MeSH query set,
# consumed (never modified) by index.corpus_sources.load_query_specification.
# Per the M3.1.1 Query Specification Contract: any modification to this
# file constitutes a new corpus specification version and therefore
# changes the resulting corpus — bump `version` accordingly.

version: "1.0"

